  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fffaf6;
      margin: 0;
      padding: 40px;
      color: #3b2e2a;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #7a4a2e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 250px;
      max-width: 1000px;
      margin: auto;
    }

    .box {
      background: #ffffff;
      border-radius: 12px;
      padding: 50px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .box:hover {
      transform: translateY(-5px);
    }

    .box h2 {
      font-size: 1.5em;
      color: #5a3729;
      margin-bottom: 10px;
    }

    .box p {
      font-size: 1em;
      color: #4a3b35;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #7a5e50;
    }
    .card-info {
      position: absolute;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 100%;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s ease;
    }
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      transform: translateX(120px);
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.6s ease;
      background: white;
      height: 300px; /* Increase image size */
      object-fit: cover;
    }
    .gold-btn {
    background: linear-gradient(to right, #d4af37, #b68c2c);

    padding: 12px 30px;
    border: none;
    border-radius: 8px;

    font-size: 1em;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: 0.3s ease;
    }
    .gold-btn:hover {
  background: linear-gradient(to right, #b68c2c, #d4af37);
  transform: scale(1.05);
    }
    footer {

}
